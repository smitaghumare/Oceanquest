<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ocean Quest | LogicLoom Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --cyan: #00F5D4;
            --glass: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: #0077b6;
            user-select: none; touch-action: none;
        }

        #bg-canvas {
            position: fixed; inset: 0;
            background: linear-gradient(180deg, #48cae4 0%, #023e8a 100%);
            z-index: 1;
        }

        /* --- SCENERY --- */
        .bubble {
            position: absolute; border-radius: 50%; bottom: -50px;
            background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3);
            animation: rise linear infinite; z-index: 2; pointer-events: none;
        }
        @keyframes rise { to { transform: translateY(-120vh) translateX(40px); opacity: 0; } }

        .kelp {
            position: fixed; bottom: -10px; width: 35px; border-radius: 50% 50% 0 0;
            background: linear-gradient(to top, #132a13, #52b788);
            animation: sway 4s infinite ease-in-out; transform-origin: bottom center; z-index: 3;
        }
        @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

        .pebble {
            position: fixed; border-radius: 50%; z-index: 4;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.4), inset 2px 2px 5px rgba(255,255,255,0.2);
        }

        /* --- LEGEND HUD --- */
        .hud {
            position: fixed; top: 20px; width: 100%; padding: 0 15px;
            display: flex; flex-direction: column; gap: 8px; z-index: 1000;
        }
        .hud-row { display: flex; justify-content: center; gap: 8px; }
        .tile {
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1.5px solid var(--gold); border-radius: 12px;
            padding: 8px; flex: 1; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .tile label { display: block; font-size: 0.5rem; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
        .tile span { font-family: 'Fredoka One'; font-size: 1rem; color: #fff; }

        /* --- ANIMATED FISH --- */
        .fish { position: absolute; cursor: pointer; z-index: 100; }
        .f-body {
            position: relative; width: 100%; height: 100%; border-radius: 50% 85% 50% 45%;
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.3), inset 5px 5px 15px rgba(255,255,255,0.4);
        }
        .f-eye {
            position: absolute; right: 15%; top: 22%; width: 20%; height: 20%;
            background: #fff; border-radius: 50%; border: 2px solid #000;
        }
        .f-eye::after { content: ''; position: absolute; width: 50%; height: 50%; background: #000; border-radius: 50%; top: 15%; left: 15%; }
        
        .f-fin {
            position: absolute; top: 35%; left: 30%; width: 40%; height: 40%;
            background: rgba(255,255,255,0.3); border-radius: 50% 50% 50% 0;
            border: 1.5px solid #fff; animation: flap 0.4s infinite; transform-origin: left;
        }
        @keyframes flap { 0%, 100% { transform: rotateY(0deg); } 50% { transform: rotateY(-75deg); } }

        .f-tail {
            position: absolute; left: -25%; top: 12%; width: 40%; height: 75%;
            clip-path: polygon(0 0, 100% 50%, 0 100%); animation: wag 0.2s infinite alternate;
        }
        @keyframes wag { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }

        /* --- SCORE FLOAT --- */
        .score-float {
            position: fixed; font-family: 'Fredoka One'; font-size: 2rem; color: var(--gold);
            pointer-events: none; z-index: 2000; animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp { 
            0% { opacity: 1; transform: translateY(0) scale(0.7); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }

        /* --- MENU --- */
        .overlay {
            position: fixed; inset: 0; background: rgba(0, 5, 20, 0.85);
            display: flex; align-items: center; justify-content: center; z-index: 3000; backdrop-filter: blur(12px);
        }
        .card {
            background: linear-gradient(135deg, #023e8a, #03045e);
            border: 3px solid var(--gold); border-radius: 30px;
            width: 85%; max-width: 380px; padding: 35px 25px; text-align: center; color: white;
        }
        .btn {
            background: linear-gradient(180deg, #ffd700, #ffa000); border: none; padding: 18px;
            width: 100%; border-radius: 15px; color: #222; font-family: 'Fredoka One';
            font-size: 1.5rem; cursor: pointer; margin-top: 20px; box-shadow: 0 6px 0 #b8860b;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #b8860b; }
        
        .footer { margin-top: 25px; font-size: 0.7rem; letter-spacing: 2px; color: var(--cyan); font-weight: 900; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="bg-canvas"></div>

    <script>
        // Scenery setup
        for(let i=0; i<8; i++) {
            document.write(`<div class="kelp" style="left:${i*13}%; height:${120+Math.random()*160}px; animation-delay:${Math.random()}s;"></div>`);
        }
        const pColors = ['#7f5539', '#9c6644', '#b08968'];
        for(let i=0; i<25; i++) {
            const s = 12 + Math.random()*20;
            document.write(`<div class="pebble" style="left:${Math.random()*100}%; bottom:${Math.random()*15}px; width:${s}px; height:${s*0.7}px; background:${pColors[Math.floor(Math.random()*3)]}"></div>`);
        }
        // Bubble cycle
        setInterval(() => {
            const b = document.createElement('div'); b.className = 'bubble';
            const s = 6 + Math.random() * 15;
            b.style.width = b.style.height = s + 'px';
            b.style.left = Math.random() * 100 + '%';
            b.style.animationDuration = (5 + Math.random() * 5) + 's';
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 10000);
        }, 700);
    </script>

    <div class="hud">
        <div class="hud-row">
            <div class="tile"><label>HERO</label><span id="uName">---</span></div>
            <div class="tile"><label>TOTAL SCORE</label><span id="uTotal">0</span></div>
        </div>
        <div class="hud-row">
            <div class="tile"><label>LEVEL CATCH</label><span id="uScore">0</span></div>
            <div class="tile"><label>LEVEL</label><span id="uLvl">1</span></div>
            <div class="tile"><label>TIME</label><span id="uTime">30</span></div>
        </div>
    </div>

    <div id="menu" class="overlay">
        <div class="card">
            <div id="m-icon" style="font-size: 4rem; margin-bottom: 5px;">🐠</div>
            <h1 id="m-title" style="font-family:'Fredoka One'; font-size: 2.1rem; color: var(--gold);">OCEAN QUEST</h1>
            <p id="msg" style="font-weight: 700; color: #fff; margin-top: 5px;">LEGEND OF LOGICLOOM</p>
            
            <input type="text" id="pInput" placeholder="HERO NAME" maxlength="10" 
            style="width: 100%; padding: 15px; border-radius: 12px; border: none; text-align: center; margin-top: 15px; font-weight: 900; background: rgba(255,255,255,0.1); color: white;">

            <button class="btn" id="m-btn" onclick="start()">START QUEST</button>
            <div class="footer">Design by LogicLoom Studio</div>
        </div>
    </div>

    <script>
        let score = 0, totalScore = 0, time = 30, active = false, level = 1;
        let audioCtx;

        // --- DYNAMIC SOUND ENGINE ---
        function playTone(freq, dur, vol) {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        // Ambient Hum
        function playHum() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const hum = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            hum.type = 'sine'; hum.frequency.setValueAtTime(50, audioCtx.currentTime);
            g.gain.setValueAtTime(0.02, audioCtx.currentTime);
            hum.connect(g); g.connect(audioCtx.destination);
            hum.start();
        }

        function start() {
            playHum();
            document.getElementById('uName').innerText = (document.getElementById('pInput').value || "HERO").toUpperCase();
            document.getElementById('menu').style.display = 'none';
            score = 0; time = 30; active = true;
            document.getElementById('uScore').innerText = "0";
            document.getElementById('uLvl').innerText = level;
            tick(); spawn();
        }

        function spawn() {
            if(!active) return;
            makeFish();
            setTimeout(spawn, Math.max(1000 - (level * 75), 250));
        }

        function makeFish() {
            const f = document.createElement('div');
            const isR = Math.random() > 0.5;
            const r = Math.random();
            let pts = r > 0.85 ? 100 : (r > 0.6 ? 50 : 10);
            let size = pts === 100 ? 55 : (pts === 50 ? 85 : 130);
            let color = pts === 100 ? '#ff006e' : (pts === 50 ? '#ffbe0b' : '#3a86ff');

            f.className = 'fish';
            f.style.width = size + 'px'; f.style.height = (size * 0.6) + 'px';
            f.style.transform = isR ? 'scaleX(1)' : 'scaleX(-1)';
            f.innerHTML = `<div class="f-tail" style="background:${color}"></div><div class="f-body" style="background:${color}"><div class="f-eye"></div><div class="f-fin"></div></div>`;
            
            f.style.top = (25 + Math.random() * 55) + '%';
            f.style.left = isR ? '-200px' : (window.innerWidth + 50) + 'px';
            document.body.appendChild(f);

            f.animate([{ left: f.style.left }, { left: isR ? (window.innerWidth + 50) + 'px' : '-200px' }], { 
                duration: (5000 / (1 + level * 0.2))
            }).onfinish = () => f.remove();

            const hit = (e) => {
                if(!active) return;
                score += pts;
                totalScore += pts;
                document.getElementById('uScore').innerText = score;
                document.getElementById('uTotal').innerText = totalScore;
                
                // Play Catch Sound
                playTone(400 + (pts * 2), 0.3, 0.05);

                const p = document.createElement('div');
                p.className = 'score-float';
                p.innerText = `+${pts}`;
                const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0));
                const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0));
                p.style.left = x + 'px'; p.style.top = y + 'px';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 800);

                f.remove();
            };
            f.onmousedown = hit; f.ontouchstart = hit;
        }

        function tick() {
            const t = setInterval(() => {
                if(!active) { clearInterval(t); return; }
                time--; document.getElementById('uTime').innerText = time;
                if(time <= 0) { active = false; stop(); }
            }, 1000);
        }

        function stop() {
            const menu = document.getElementById('menu');
            const msg = document.getElementById('msg');
            const btn = document.getElementById('m-btn');
            const title = document.getElementById('m-title');
            const icon = document.getElementById('m-icon');

            menu.style.display = 'flex';
            if(score >= level * 350) {
                level++;
                icon.innerText = "🏆";
                title.innerText = "MISSION SUCCESS!";
                msg.innerText = "THE OCEAN BOWS TO YOU.";
                btn.innerText = "PLAY NEXT LEVEL";
            } else {
                icon.innerText = "🌊";
                title.innerText = "LOW TIDE";
                msg.innerText = "SCORE HIGHER TO PROGRESS!";
                btn.innerText = "RETRY LEVEL";
            }
        }
    </script>
</body>
</html>
